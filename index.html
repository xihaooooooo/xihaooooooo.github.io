<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="ZXH 的个人空间，用一行命令认识我。">
<title>ZXH — Terminal</title>
<style>
  :root {
    --paper: #eee9dd;
    --paper-light: #f7f3e9;
    --paper-deep: #e5dfd1;
    --ink: #2e342f;
    --ink-soft: #6f756e;
    --ink-faint: #a5a79f;
    --green: #4f6b55;
    --green-soft: #dce4d9;
    --line: rgba(63, 69, 62, 0.16);
    --shadow: rgba(54, 52, 43, 0.13);
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(circle at 12% 0%, rgba(255,255,255,.72), transparent 28rem),
      radial-gradient(circle at 88% 100%, rgba(208,202,185,.32), transparent 34rem),
      var(--paper);
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", "Noto Sans Mono CJK SC", monospace;
    line-height: 1.65;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .3;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.09'/%3E%3C/svg%3E");
    mix-blend-mode: multiply;
  }
  button, input { font: inherit; }
  .page {
    width: min(1180px, calc(100% - 64px));
    min-height: 100svh;
    margin: 0 auto;
    padding: 34px 0 24px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 28px;
  }
  .site-head, .site-foot { display: flex; align-items: center; justify-content: space-between; }
  .identity { display: inline-flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; }
  .identity-mark {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border: 1px solid var(--ink);
    border-radius: 50%;
    font-size: 11px;
    letter-spacing: -.05em;
  }
  .identity-copy { line-height: 1.15; }
  .identity-name { display: block; font-size: 13px; font-weight: 700; letter-spacing: .18em; }
  .identity-role { display: block; margin-top: 5px; color: var(--ink-soft); font-size: 10px; letter-spacing: .08em; }
  .head-status { display: flex; align-items: center; gap: 9px; color: var(--ink-soft); font-size: 11px; letter-spacing: .08em; }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 5px rgba(79, 107, 85, .10);
    animation: status-pulse 3s ease-in-out infinite;
  }
  main { display: grid; align-items: center; padding: 8px 0; }
  .terminal {
    position: relative;
    width: 100%;
    height: clamp(520px, 69vh, 720px);
    min-height: 0;
    display: grid;
    grid-template-rows: 50px 1fr auto;
    overflow: hidden;
    border: 1px solid rgba(54, 61, 54, .18);
    border-radius: 14px;
    background: rgba(248, 245, 236, .90);
    box-shadow: 0 28px 70px var(--shadow), 0 2px 0 rgba(255,255,255,.75) inset;
    backdrop-filter: blur(14px);
    animation: terminal-enter .75s cubic-bezier(.2,.75,.25,1) both;
  }
  .terminal::after {
    content: "";
    position: absolute;
    inset: 50px 0 0;
    pointer-events: none;
    background: linear-gradient(105deg, transparent 0 72%, rgba(255,255,255,.22) 72% 100%);
  }
  .terminal-bar {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(232, 227, 215, .66);
  }
  .window-controls { display: flex; gap: 8px; }
  .window-dot { width: 9px; height: 9px; border-radius: 50%; border: 1px solid rgba(46,52,47,.38); }
  .window-dot:nth-child(2) { opacity: .65; }
  .window-dot:nth-child(3) { opacity: .4; }
  .terminal-title { color: var(--ink-soft); font-size: 11px; letter-spacing: .04em; }
  .terminal-mode { justify-self: end; color: var(--green); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
  .terminal-output {
    position: relative;
    z-index: 1;
    overflow-y: auto;
    padding: 34px 38px 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--paper-deep) transparent;
  }
  .terminal-output::-webkit-scrollbar { width: 7px; }
  .terminal-output::-webkit-scrollbar-thumb { background: var(--paper-deep); border-radius: 8px; }
  .output-block { margin: 0 0 18px; animation: line-in .32s ease-out both; }
  .output-line { min-height: 1.65em; white-space: pre-wrap; overflow-wrap: anywhere; font-size: clamp(12px, 1.1vw, 14px); }
  .accent { color: var(--green); }
  .output-line.muted { color: var(--ink-soft); }
  .output-line.accent { color: var(--green); }
  .output-line.error { color: #8a554e; }
  .output-line.command-line { color: var(--ink-soft); }
  .output-line.command-line .command-text { color: var(--ink); }
  .ascii {
    color: var(--green);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -.08em;
    white-space: pre;
    font-size: clamp(10px, 1.35vw, 17px);
    margin-bottom: 18px;
  }
  .welcome { max-width: 720px; font-size: clamp(13px, 1.25vw, 15px); }
  .command-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 5px 28px;
    width: min(600px, 100%);
    margin-top: 8px;
  }
  .command-item { display: grid; grid-template-columns: 92px 1fr; gap: 8px; font-size: 13px; }
  .command-name { color: var(--green); }
  .command-desc { color: var(--ink-soft); }
  .post-row { display: grid; grid-template-columns: 90px 1fr; gap: 14px; padding: 5px 0; color: inherit; text-decoration: none; }
  .post-row:hover .post-title { color: var(--green); text-decoration: underline; text-underline-offset: 4px; }
  .post-date { color: var(--ink-faint); }
  .post-title { transition: color .18s ease; }
  .ls-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 3px 18px;
    max-width: min(760px, 100%);
    margin-top: 3px;
  }
  .ls-entry { min-width: 0; overflow-wrap: anywhere; font-size: 13px; }
  .ls-entry.directory { color: var(--green); font-weight: bold; }
  .ls-entry.file { color: var(--ink-soft); }
  .terminal-input-row {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 9px;
    min-height: 64px;
    padding: 14px 38px 18px;
    border-top: 1px solid rgba(63, 69, 62, .10);
    background: linear-gradient(180deg, rgba(247,243,233,.6), rgba(247,243,233,.96));
  }
  .prompt-user { color: var(--green); font-weight: 700; }
  .prompt-path { color: var(--ink-soft); }
  .prompt-symbol { color: var(--ink); }
  #command-input {
    min-width: 0;
    flex: 1;
    padding: 4px 0;
    border: 0;
    outline: 0;
    color: var(--ink);
    background: transparent;
    caret-color: var(--green);
    font-size: 14px;
  }
  #command-input::placeholder { color: var(--ink-faint); opacity: .65; }
  .enter-key {
    padding: 5px 8px;
    border: 1px solid var(--line);
    border-bottom-color: rgba(63,69,62,.28);
    border-radius: 5px;
    color: var(--ink-faint);
    background: rgba(255,255,255,.22);
    font-size: 9px;
    letter-spacing: .08em;
  }
  .site-foot { color: var(--ink-soft); font-size: 10px; letter-spacing: .06em; }
  .quick-commands { display: flex; gap: 6px; }
  .quick-command {
    border: 0;
    padding: 3px 6px;
    color: var(--ink-soft);
    background: transparent;
    cursor: pointer;
    font-size: 10px;
    transition: color .18s ease, transform .18s ease;
  }
  .quick-command:hover { color: var(--green); transform: translateY(-1px); }
  @keyframes terminal-enter { from { opacity: 0; transform: translateY(18px) scale(.992); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes line-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes status-pulse { 0%, 100% { box-shadow: 0 0 0 4px rgba(79, 107, 85, .08); } 50% { box-shadow: 0 0 0 7px rgba(79, 107, 85, .13); } }
  @media (max-width: 720px) {
    .page { width: min(100% - 28px, 1180px); padding: 20px 0 14px; gap: 16px; }
    .identity-role, .terminal-mode { display: none; }
    .terminal { height: calc(100svh - 128px); min-height: 480px; border-radius: 10px; }
    .terminal-bar { grid-template-columns: 1fr auto; padding: 0 14px; }
    .terminal-title { justify-self: end; }
    .terminal-output { padding: 24px 20px 12px; }
    .terminal-input-row { padding: 12px 20px 14px; }
    .ascii { font-size: clamp(8px, 2.7vw, 12px); }
    .command-grid { grid-template-columns: 1fr; }
    .command-item { grid-template-columns: 78px 1fr; }
    .enter-key, .quick-commands { display: none; }
    .site-foot { justify-content: center; }
  }
  @media (max-width: 410px) {
    .head-status span:last-child { display: none; }
    .terminal-input-row { gap: 6px; }
    .prompt-user { display: none; }
    .post-row { grid-template-columns: 1fr; gap: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
  }

  /* Linux desktop, circa 2001 */
  :root {
    --desktop: #d8d5cc;
    --chrome: #d6d3ca;
    --chrome-light: #f1efe8;
    --chrome-dark: #77756e;
    --titlebar: #52677d;
    --screen: #111510;
    --terminal-text: #d2d7c4;
    --terminal-muted: #929989;
    --terminal-green: #83a77a;
  }
  html, body { height: 100%; }
  body {
    min-width: 320px;
    color: #191919;
    background: var(--desktop);
    font-family: "Courier New", Courier, "Noto Sans Mono CJK SC", monospace;
    line-height: 1.45;
  }
  body::before { display: none; }
  .page {
    width: 100%;
    min-height: 100svh;
    padding: 4px 6px 38px;
    display: block;
  }
  .site-head {
    height: 32px;
    padding: 2px 3px;
    color: #202020;
    background: var(--chrome);
    border-top: 2px solid var(--chrome-light);
    border-left: 2px solid var(--chrome-light);
    border-right: 2px solid var(--chrome-dark);
    border-bottom: 2px solid var(--chrome-dark);
    font-family: Arial, "Microsoft YaHei", sans-serif;
    font-size: 12px;
  }
  .desktop-menu { display: flex; align-items: center; height: 100%; gap: 1px; }
  .desktop-menu button {
    height: 23px;
    padding: 0 10px;
    border: 1px solid transparent;
    color: #202020;
    background: transparent;
    font: 12px Arial, "Microsoft YaHei", sans-serif;
  }
  .desktop-menu button:hover {
    border-top-color: #fff;
    border-left-color: #fff;
    border-right-color: #777;
    border-bottom-color: #777;
    background: #e7e4dc;
  }
  .panel-logo {
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    margin-right: 3px;
    color: #e8eee5;
    background: #405a47;
    border: 1px solid #263b2c;
    font: bold 10px "Courier New", monospace;
  }
  .head-status {
    height: 22px;
    padding: 0 8px;
    gap: 6px;
    color: #303030;
    background: #c8c5bd;
    border-top: 1px solid #85827b;
    border-left: 1px solid #85827b;
    border-right: 1px solid #efede6;
    border-bottom: 1px solid #efede6;
    font: 11px "Courier New", monospace;
    letter-spacing: 0;
  }
  .status-dot {
    width: 6px;
    height: 6px;
    background: #49684f;
    box-shadow: none;
    animation: none;
  }
  main { display: block; padding: 0; }
  .terminal {
    width: min(1000px, calc(100% - 40px));
    height: calc(100svh - 116px);
    min-height: 500px;
    margin: 28px auto 0;
    grid-template-rows: 28px 1fr 42px;
    border: 2px solid;
    border-color: var(--chrome-light) var(--chrome-dark) var(--chrome-dark) var(--chrome-light);
    border-radius: 0;
    background: var(--screen);
    box-shadow: 3px 4px 0 rgba(0,0,0,.25);
    backdrop-filter: none;
    animation: none;
  }
  .terminal::after { display: none; }
  .terminal-bar {
    grid-template-columns: 1fr auto 1fr;
    min-width: 0;
    padding: 2px 3px 2px 5px;
    color: #fff;
    background: var(--titlebar);
    border: 0;
    font-family: Arial, "Microsoft YaHei", sans-serif;
  }
  .terminal-app { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px; font-weight: bold; }
  .terminal-icon {
    width: 18px;
    height: 18px;
    display: grid;
    place-items: center;
    color: #a9d49c;
    background: #121712;
    border: 1px solid #d8d8d8;
    font: bold 9px "Courier New", monospace;
  }
  .terminal-title { color: #f4f4f4; font-size: 11px; letter-spacing: 0; white-space: nowrap; }
  .terminal-mode { display: none; }
  .window-controls { justify-self: end; gap: 2px; }
  .window-dot {
    width: 19px;
    height: 19px;
    display: grid;
    place-items: center;
    border: 1px solid;
    border-color: #f3f1eb #65635e #65635e #f3f1eb;
    border-radius: 0;
    color: #111;
    background: var(--chrome);
    font: bold 12px Arial, sans-serif;
    opacity: 1 !important;
  }
  .terminal-output {
    padding: 20px 22px 8px;
    color: var(--terminal-text);
    background: var(--screen);
    scrollbar-color: #777 #242a23;
  }
  .terminal-output::-webkit-scrollbar { width: 14px; }
  .terminal-output::-webkit-scrollbar-track { background: #242a23; border-left: 1px solid #050705; }
  .terminal-output::-webkit-scrollbar-thumb { background: #73786c; border: 2px outset #93998b; border-radius: 0; }
  .output-block { margin: 0 0 14px; animation: none; }
  .output-line { min-height: 1.45em; color: var(--terminal-text); font-size: 13px; }
  .accent, .output-line.accent, .command-name, .prompt-user { color: var(--terminal-green); }
  .output-line.muted, .command-desc, .post-date { color: var(--terminal-muted); }
  .output-line.error { color: #d48b80; }
  .output-line.command-line { color: var(--terminal-green); }
  .output-line.command-line .command-text { color: var(--terminal-text); }
  .boot-info { color: var(--terminal-muted); }
  .boot-welcome { color: var(--terminal-text); margin-top: 12px; }
  .ascii { display: none; }
  .welcome { max-width: none; font-size: 13px; }
  .command-grid { gap: 2px 24px; margin-top: 6px; }
  .command-item { font-size: 13px; }
  .post-row { color: var(--terminal-text); padding: 2px 0; }
  .post-row:hover .post-title { color: var(--terminal-green); text-decoration: underline; }
  .ls-entry.directory { color: var(--terminal-green); }
  .ls-entry.file { color: var(--terminal-text); }
  .terminal-input-row {
    min-height: 42px;
    padding: 7px 22px 8px;
    gap: 6px;
    color: var(--terminal-text);
    background: var(--screen);
    border-top: 1px solid #2d342c;
  }
  .prompt-path { color: var(--terminal-muted); }
  .prompt-symbol { color: var(--terminal-text); }
  #command-input {
    padding: 0;
    color: var(--terminal-text);
    caret-color: #9fc394;
    font: 13px "Courier New", Courier, monospace;
  }
  #command-input::placeholder { color: #61685d; opacity: 1; }
  .enter-key { display: none; }
  .site-foot {
    position: fixed;
    z-index: 10;
    left: 6px;
    right: 6px;
    bottom: 4px;
    height: 30px;
    justify-content: flex-start;
    padding: 2px 3px;
    color: #181818;
    background: var(--chrome);
    border-top: 2px solid var(--chrome-light);
    border-left: 2px solid var(--chrome-light);
    border-right: 2px solid var(--chrome-dark);
    border-bottom: 2px solid var(--chrome-dark);
    font: 11px Arial, "Microsoft YaHei", sans-serif;
    letter-spacing: 0;
  }
  .start-button, .task-button {
    height: 21px;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0 8px;
    border: 1px solid;
    border-color: #fff #777 #777 #fff;
    color: #111;
    background: #d7d4cc;
    font: bold 11px Arial, "Microsoft YaHei", sans-serif;
  }
  .start-button { margin-right: 8px; }
  .task-button { width: 170px; background: #c4c1b9; border-color: #777 #eee #eee #777; }
  .start-glyph { color: #3e6246; font: bold 13px "Courier New", monospace; }
  .panel-clock {
    margin-left: auto;
    min-width: 56px;
    height: 21px;
    display: grid;
    place-items: center;
    border: 1px inset #eee;
    font: 11px "Courier New", monospace;
  }
  .quick-commands { display: none; }
  @media (max-width: 720px) {
    .page { width: 100%; padding: 3px 3px 35px; }
    .site-head { height: 30px; }
    .desktop-menu button { padding: 0 6px; font-size: 11px; }
    .desktop-menu button:nth-of-type(3) { display: none; }
    .head-status { padding: 0 5px; }
    .terminal {
      width: calc(100% - 8px);
      height: calc(100svh - 78px);
      min-height: 430px;
      margin-top: 8px;
      grid-template-rows: 27px 1fr 40px;
    }
    .terminal-output { padding: 15px 12px 6px; }
    .terminal-input-row { padding: 6px 12px 7px; }
    .terminal-title { display: block; }
    .terminal-bar { grid-template-columns: 1fr auto; }
    .terminal-title { display: none; }
    .site-foot { left: 3px; right: 3px; bottom: 3px; }
    .task-button { width: 130px; }
    .command-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 420px) {
    .desktop-menu button:nth-of-type(2) { display: none; }
    .head-status span:last-child { display: inline; }
    .window-dot { width: 18px; }
    .prompt-user { display: inline; }
  }

  /* Full-screen terminal: no desktop chrome */
  body { background: var(--screen); }
  .page {
    width: 100%;
    min-height: 100svh;
    padding: 0;
  }
  main { width: 100%; height: 100svh; }
  .terminal {
    width: 100%;
    height: 100svh;
    min-height: 420px;
    margin: 0;
    grid-template-rows: 1fr 46px;
    border: 0;
    box-shadow: none;
  }
  .terminal-output { padding: 28px 32px 10px; }
  .terminal-input-row { padding: 8px 32px 10px; }
  @media (max-width: 720px) {
    .page { padding: 0; }
    .terminal {
      width: 100%;
      height: 100svh;
      min-height: 420px;
      margin: 0;
      grid-template-rows: 1fr 44px;
    }
    .terminal-output { padding: 20px 16px 8px; }
    .terminal-input-row { padding: 7px 16px 9px; }
  }

  /* Low-resolution print / terminal text */
  .terminal::before {
    content: "";
    position: absolute;
    z-index: 3;
    inset: 0 0 46px;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 3px,
      rgba(0, 0, 0, .13) 4px
    );
    opacity: .22;
  }
  .terminal-output,
  .terminal-input-row,
  #command-input {
    font-family: "Lucida Console", "Courier New", SimSun, monospace;
    -webkit-font-smoothing: none;
    font-synthesis: none;
    font-variant-ligatures: none;
  }
  .output-line,
  .command-item,
  .post-row,
  .prompt-user,
  .prompt-path,
  .prompt-symbol,
  #command-input {
    letter-spacing: .018em;
    text-shadow:
      .55px 0 rgba(194, 210, 181, .42),
      -.4px 0 rgba(73, 91, 68, .5);
  }
  .output-line:nth-child(4n + 1) { opacity: .9; transform: translateX(.2px); }
  .output-line:nth-child(4n + 2) { opacity: .84; }
  .output-line:nth-child(4n + 3) { text-shadow: .8px 0 rgba(194, 210, 181, .4), -.25px 0 rgba(73, 91, 68, .55); }
  #command-input::placeholder { text-shadow: .4px 0 rgba(118, 130, 110, .25); }

  .article-reader[hidden] { display: none; }
  .article-reader {
    position: absolute;
    z-index: 6;
    inset: 0;
    display: grid;
    grid-template-rows: 1fr 25px;
    color: var(--terminal-text);
    background: var(--screen);
    font-family: "Lucida Console", "Courier New", SimSun, monospace;
    -webkit-font-smoothing: none;
  }
  .reader-body {
    overflow-y: auto;
    padding: 24px 32px 42px;
    outline: 0;
    scrollbar-color: #687062 #1a2019;
  }
  .reader-body::-webkit-scrollbar { width: 12px; }
  .reader-body::-webkit-scrollbar-track { background: #1a2019; }
  .reader-body::-webkit-scrollbar-thumb { background: #687062; border: 2px solid #1a2019; }
  .reader-line {
    min-height: 1.5em;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    color: var(--terminal-text);
    font-size: 13px;
    line-height: 1.55;
    letter-spacing: .018em;
    text-shadow: .55px 0 rgba(194, 210, 181, .42), -.4px 0 rgba(73, 91, 68, .5);
  }
  .reader-line:nth-child(4n + 1) { opacity: .9; }
  .reader-line:nth-child(4n + 2) { opacity: .84; }
  .reader-heading {
    margin: 1.25em 0 .45em;
    color: #91b487;
    font-weight: bold;
  }
  .reader-heading.level-1 { margin-top: 0; color: #aac59f; font-size: 15px; text-transform: uppercase; }
  .reader-heading.level-2 { font-size: 14px; }
  .reader-code { color: #b5bea9; padding-left: 2ch; }
  .reader-quote { color: var(--terminal-muted); padding-left: 2ch; }
  .reader-rule { color: #596354; }
  .reader-status {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    padding: 0 7px;
    color: #11160f;
    background: #91a486;
    font-size: 11px;
    font-weight: bold;
    line-height: 25px;
  }
  .reader-file { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reader-position { margin-left: auto; white-space: nowrap; }
  .reader-quit {
    height: 19px;
    padding: 0 5px;
    border: 0;
    color: #11160f;
    background: transparent;
    font: bold 11px "Lucida Console", "Courier New", monospace;
    cursor: pointer;
  }
  .reader-quit:hover, .reader-quit:focus { color: #e8eddf; background: #344331; outline: 0; }
  @media (max-width: 720px) {
    .reader-body { padding: 18px 16px 36px; }
    .reader-line { font-size: 12px; }
    .reader-status { gap: 6px; font-size: 10px; }
    .reader-position .reader-keys { display: none; }
  }
</style>
</head>
<body>
  <div class="page">
    <main>
      <section class="terminal" aria-label="交互式个人终端" id="terminal">
        <div class="terminal-output" id="terminal-output" role="log" aria-live="polite">
          <div class="output-block boot-block">
            <div class="output-line boot-info">Linux zxh.local 2.4.18-14 #1 i686 GNU/Linux</div>
            <div class="output-line boot-info">Last login: Tue Sep  9 20:00:01 on tty1</div>
            <div class="output-line boot-welcome">Welcome to zxh.local</div>
            <div class="output-line">输入 'ls' 查看目录，使用 'cd &lt;dir&gt;' 进入下一级。</div>
          </div>
        </div>
        <form class="terminal-input-row" id="command-form" autocomplete="off">
          <span class="prompt-user">guest@zxh</span><span class="prompt-path" id="prompt-path">:~/posts</span><span class="prompt-symbol">$</span>
          <label for="command-input" hidden>输入命令</label>
          <input id="command-input" name="command" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type a command…" autofocus>
          <span class="enter-key" aria-hidden="true">ENTER ↵</span>
        </form>
        <section class="article-reader" id="article-reader" aria-label="文章阅读器" hidden>
          <div class="reader-body" id="reader-body" tabindex="0"></div>
          <div class="reader-status">
            <span class="reader-file" id="reader-file"></span>
            <span class="reader-position"><span class="reader-keys">↑↓ PgUp PgDn · </span><span id="reader-percent">0%</span></span>
            <button class="reader-quit" id="reader-quit" type="button">q:quit</button>
          </div>
        </section>
      </section>
    </main>
  </div>
<script>
  const output = document.getElementById('terminal-output');
  const input = document.getElementById('command-input');
  const promptPath = document.getElementById('prompt-path');
  const form = document.getElementById('command-form');
  const terminal = document.getElementById('terminal');
  const articleReader = document.getElementById('article-reader');
  const readerBody = document.getElementById('reader-body');
  const readerFile = document.getElementById('reader-file');
  const readerPercent = document.getElementById('reader-percent');
  const readerQuit = document.getElementById('reader-quit');
  const history = [];
  let historyIndex = 0;
  let currentDirectory = '';
  const commandNames = ['help', 'about', 'posts', 'ls', 'cd', 'open', 'whoami', 'pwd', 'date', 'history', 'echo', 'clear'];
  const shellPath = () => `~/posts${currentDirectory ? `/${currentDirectory}` : ''}`;
  const updatePrompt = () => { promptPath.textContent = `:${shellPath()}`; };
  const createLine = (text = '', className = '') => {
    const line = document.createElement('div');
    line.className = `output-line ${className}`.trim();
    line.textContent = text;
    return line;
  };
  const addBlock = (...nodes) => {
    const block = document.createElement('div');
    block.className = 'output-block';
    nodes.forEach(node => block.appendChild(node));
    output.appendChild(block);
    requestAnimationFrame(() => { output.scrollTop = output.scrollHeight; });
    return block;
  };
  const addPromptLine = command => {
    const line = document.createElement('div');
    line.className = 'output-line command-line';
    line.append(document.createTextNode(`guest@zxh:${shellPath()}$ `));
    const value = document.createElement('span');
    value.className = 'command-text';
    value.textContent = command;
    line.appendChild(value);
    return line;
  };
  const showHelp = () => {
    const intro = createLine('可用命令', 'muted');
    const grid = document.createElement('div');
    grid.className = 'command-grid';
    [['about', '关于我'], ['posts', '最近文章'], ['ls', '当前目录'], ['cd <dir>', '进入目录'], ['cd ..', '返回上级'], ['open <file>', '打开文章'], ['whoami', '当前访客'], ['date', '本地时间'], ['history', '命令记录'], ['clear', '清空屏幕']].forEach(([name, description]) => {
      const item = document.createElement('div');
      item.className = 'command-item';
      const command = document.createElement('span');
      command.className = 'command-name';
      command.textContent = name;
      const desc = document.createElement('span');
      desc.className = 'command-desc';
      desc.textContent = description;
      item.append(command, desc);
      grid.appendChild(item);
    });
    addBlock(intro, grid, createLine('例：cd java  →  ls  →  open 01-java-基础.md', 'muted'));
  };
  const fallbackPostIds = [
    'agent问题/未命名',
    'book_exam/出题模块',
    'book_exam/判题模块',
    'book_exam/我做项目遇到的问题',
    'book_exam/学生画像模块',
    'book_exam/学生画像模块2',
    'java/01-java-基础',
    'java/02-集合框架',
    'java/03-并发编程',
    'java/04-JVM',
    'java/05-Spring',
    'java/06-MySQL',
    'java/07-Redis',
    'java/08-计算机网络',
    'java/09-操作系统',
    'java/10-设计模式',
    'java/java随笔',
    'onecoupon/one',
    'onecoupon/同步领卷',
    'onecoupon/模板创建',
    '日常面经/3.6',
    '日常面经/3.7',
    '日常面经/3.8',
    '日常面经/9.6',
    '随笔/再一次见你'
  ];
  const fallbackPosts = fallbackPostIds.map(id => ({
    id,
    dir: id.slice(0, id.lastIndexOf('/')),
    title: id.slice(id.lastIndexOf('/') + 1),
    date: ''
  }));
  const loadPosts = async () => {
    try {
      const response = await fetch('posts.json');
      if (!response.ok) throw new Error('request failed');
      return await response.json();
    } catch (error) {
      return fallbackPosts;
    }
  };
  const showPosts = async () => {
    const block = addBlock(createLine('正在读取 posts/ …', 'muted'));
    try {
      const posts = await loadPosts();
      block.replaceChildren(createLine(`最近更新 · ${posts.length} 篇文章`, 'accent'));
      posts.slice(0, 6).forEach(post => {
        const row = document.createElement('div');
        row.className = 'post-row';
        const date = document.createElement('span');
        date.className = 'post-date';
        date.textContent = post.date || '—';
        const title = document.createElement('span');
        title.className = 'post-title';
        title.textContent = `${post.id}.md — ${post.title}`;
        row.append(date, title);
        block.appendChild(row);
      });
      block.appendChild(createLine('输入 ls 查看全部路径，使用 open <path> 阅读。', 'muted'));
    } catch (error) {
      block.replaceChildren(createLine('文章索引暂时不可用。', 'error'), createLine('提示：请通过本地服务器或网站地址访问，而不是直接打开 HTML 文件。', 'muted'));
    }
    output.scrollTop = output.scrollHeight;
  };
  const resolvePath = rawPath => {
    let value = rawPath.trim().replace(/\\/g, '/').replace(/\/+$/, '');
    let parts = currentDirectory ? currentDirectory.split('/') : [];

    if (!value || value === '.' || value === '~' || value === '/' || value === 'posts' || value === '~/posts' || value === '/home/zxh/posts') {
      return value === '.' ? currentDirectory : '';
    }

    const absolutePrefixes = ['~/posts/', '/home/zxh/posts/', 'posts/'];
    const prefix = absolutePrefixes.find(item => value.startsWith(item));
    if (prefix) {
      value = value.slice(prefix.length);
      parts = [];
    } else if (value.startsWith('/')) {
      value = value.slice(1);
      parts = [];
    }

    value.split('/').filter(Boolean).forEach(segment => {
      if (segment === '.') return;
      if (segment === '..') parts.pop();
      else parts.push(segment);
    });
    return parts.join('/');
  };
  const directoryExists = (path, posts) => !path || posts.some(post => post.id.startsWith(`${path}/`));
  const getDirectoryEntries = (path, posts) => {
    const prefix = path ? `${path}/` : '';
    const entries = new Map();

    posts.forEach(post => {
      if (!post.id.startsWith(prefix)) return;
      const remainder = post.id.slice(prefix.length);
      const parts = remainder.split('/');
      const name = parts[0];
      const isDirectory = parts.length > 1;
      if (!entries.has(name) || isDirectory) entries.set(name, { name, isDirectory });
    });

    return [...entries.values()].sort((a, b) => {
      if (a.isDirectory !== b.isDirectory) return a.isDirectory ? -1 : 1;
      return a.name.localeCompare(b.name, 'zh-CN');
    });
  };
  const showDirectory = async args => {
    const posts = await loadPosts();
    const requestedPath = args.length ? resolvePath(args.join(' ')) : currentDirectory;
    if (!directoryExists(requestedPath, posts)) {
      addBlock(createLine(`ls: 无法访问 '${args.join(' ')}': 没有那个目录`, 'error'));
      return;
    }

    const entries = getDirectoryEntries(requestedPath, posts);
    const block = addBlock(createLine(`${requestedPath ? `${requestedPath}/` : 'posts/'}`, 'muted'));
    const grid = document.createElement('div');
    grid.className = 'ls-grid';
    entries.forEach(entry => {
      const item = document.createElement('span');
      item.className = `ls-entry ${entry.isDirectory ? 'directory' : 'file'}`;
      item.textContent = `${entry.name}${entry.isDirectory ? '/' : '.md'}`;
      grid.appendChild(item);
    });
    block.appendChild(grid);
    output.scrollTop = output.scrollHeight;
  };
  const changeDirectory = async args => {
    const posts = await loadPosts();
    const rawTarget = args.join(' ').trim();
    const nextDirectory = resolvePath(rawTarget || '~');
    if (!directoryExists(nextDirectory, posts)) {
      addBlock(createLine(`cd: ${rawTarget}: 没有那个目录`, 'error'));
      return;
    }
    currentDirectory = nextDirectory;
    updatePrompt();
  };
  const renderArticle = markdown => {
    const body = markdown.replace(/^---[\s\S]*?\n---\n*/, '');
    const fragment = document.createDocumentFragment();
    let inCode = false;

    body.split(/\r?\n/).forEach(rawLine => {
      const line = document.createElement('div');
      line.className = 'reader-line';
      let text = rawLine;

      if (/^```/.test(text.trim())) {
        inCode = !inCode;
        line.classList.add('reader-rule');
        text = inCode ? `-- code ${text.trim().slice(3) || ''} --` : '-- end --';
      } else if (inCode) {
        line.classList.add('reader-code');
      } else {
        const heading = text.match(/^(#{1,6})\s+(.+)$/);
        if (heading) {
          line.classList.add('reader-heading', `level-${heading[1].length}`);
          text = heading[2];
        } else if (/^\s*>/.test(text)) {
          line.classList.add('reader-quote');
          text = text.replace(/^\s*>\s?/, '> ');
        } else if (/^\s*(---+|___+|\*\*\*+)\s*$/.test(text)) {
          line.classList.add('reader-rule');
          text = '------------------------------------------------------------';
        }
        text = text
          .replace(/!\[([^\]]*)\]\([^)]+\)/g, '[image: $1]')
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1 <$2>')
          .replace(/\*\*([^*]+)\*\*/g, '$1')
          .replace(/__([^_]+)__/g, '$1')
          .replace(/`([^`]+)`/g, '$1');
      }

      line.textContent = text || '\u00a0';
      fragment.appendChild(line);
    });

    readerBody.replaceChildren(fragment);
  };
  const updateReaderPosition = () => {
    const scrollable = readerBody.scrollHeight - readerBody.clientHeight;
    const percent = scrollable <= 0 ? 100 : Math.round((readerBody.scrollTop / scrollable) * 100);
    readerPercent.textContent = `${Math.max(0, Math.min(100, percent))}%`;
  };
  const closeReader = () => {
    articleReader.hidden = true;
    readerBody.replaceChildren();
    input.focus();
  };
  const openArticleInTerminal = async post => {
    try {
      const response = await fetch(encodeURI(`posts/${post.id}.md`));
      if (!response.ok) throw new Error('request failed');
      renderArticle(await response.text());
      readerFile.textContent = `posts/${post.id}.md`;
      articleReader.hidden = false;
      readerBody.scrollTop = 0;
      updateReaderPosition();
      readerBody.focus();
    } catch (error) {
      addBlock(createLine(`open: 无法读取 posts/${post.id}.md`, 'error'), createLine('请通过个人博客地址或本地服务器访问。', 'muted'));
    }
  };
  const openTarget = async args => {
    const rawTarget = args.join(' ').trim();
    if (!rawTarget || ['blog', 'posts', 'posts/'].includes(rawTarget.toLowerCase())) {
      showPosts();
      return;
    }

    const target = resolvePath(rawTarget).replace(/\.md$/i, '');
    const posts = await loadPosts();
    const post = posts.find(item => item.id.toLocaleLowerCase() === target.toLocaleLowerCase());

    if (!post) {
      addBlock(createLine(`open: 找不到 “${rawTarget}”`, 'error'), createLine('输入 ls 查看可用的文章路径。', 'muted'));
      return;
    }

    addBlock(createLine(`正在打开 posts/${post.id}.md …`, 'muted'));
    openArticleInTerminal(post);
  };
  const runCommand = rawCommand => {
    const normalized = rawCommand.trim();
    if (!normalized) return;
    history.push(normalized);
    historyIndex = history.length;
    addBlock(addPromptLine(normalized));
    const [command, ...args] = normalized.split(/\s+/);
    const lowerCommand = command.toLowerCase();
    switch (lowerCommand) {
      case 'help': showHelp(); break;
      case 'about':
        addBlock(createLine('朱习浩 (ZXH)', 'accent'), createLine('Java 后端开发。'), createLine('这里放项目笔记、面试记录和随笔。', 'muted'));
        break;
      case 'posts': showPosts(); break;
      case 'ls': showDirectory(args); break;
      case 'cd': changeDirectory(args); break;
      case 'open': openTarget(args); break;
      case 'whoami': addBlock(createLine('guest — 一位正在探索这里的访客')); break;
      case 'pwd': addBlock(createLine(`/home/zxh/posts${currentDirectory ? `/${currentDirectory}` : ''}`)); break;
      case 'date': addBlock(createLine(new Intl.DateTimeFormat('zh-CN', { dateStyle: 'full', timeStyle: 'medium' }).format(new Date()))); break;
      case 'history': addBlock(...history.map((item, index) => createLine(`${String(index + 1).padStart(3, ' ')}  ${item}`, 'muted'))); break;
      case 'echo': addBlock(createLine(args.join(' '))); break;
      case 'clear': output.replaceChildren(); break;
      default: addBlock(createLine(`${command}: command not found`, 'error'), createLine('输入 help 查看可用命令。', 'muted'));
    }
  };
  form.addEventListener('submit', event => {
    event.preventDefault();
    const command = input.value;
    input.value = '';
    runCommand(command);
  });
  readerBody.addEventListener('scroll', updateReaderPosition);
  readerQuit.addEventListener('click', closeReader);
  readerBody.addEventListener('keydown', event => {
    const page = Math.max(160, readerBody.clientHeight * .85);
    if (event.key === 'q' || event.key === 'Q' || event.key === 'Escape') {
      event.preventDefault();
      closeReader();
    } else if (event.key === 'ArrowDown') {
      event.preventDefault();
      readerBody.scrollBy({ top: 32 });
    } else if (event.key === 'ArrowUp') {
      event.preventDefault();
      readerBody.scrollBy({ top: -32 });
    } else if (event.key === 'PageDown' || (event.key === ' ' && !event.shiftKey)) {
      event.preventDefault();
      readerBody.scrollBy({ top: page });
    } else if (event.key === 'PageUp' || (event.key === ' ' && event.shiftKey)) {
      event.preventDefault();
      readerBody.scrollBy({ top: -page });
    } else if (event.key === 'Home') {
      event.preventDefault();
      readerBody.scrollTop = 0;
    } else if (event.key === 'End') {
      event.preventDefault();
      readerBody.scrollTop = readerBody.scrollHeight;
    }
  });
  input.addEventListener('keydown', event => {
    if (event.key === 'ArrowUp') {
      event.preventDefault();
      if (historyIndex > 0) historyIndex -= 1;
      input.value = history[historyIndex] || '';
      input.setSelectionRange(input.value.length, input.value.length);
    }
    if (event.key === 'ArrowDown') {
      event.preventDefault();
      if (historyIndex < history.length) historyIndex += 1;
      input.value = history[historyIndex] || '';
    }
    if (event.key === 'Tab') {
      event.preventDefault();
      const value = input.value.trim().toLowerCase();
      const match = commandNames.find(name => name.startsWith(value));
      if (match) input.value = match;
    }
    if (event.key.toLowerCase() === 'l' && event.ctrlKey) {
      event.preventDefault();
      output.replaceChildren();
    }
  });
  terminal.addEventListener('click', event => { if (!event.target.closest('button, a')) input.focus(); });
  document.querySelectorAll('[data-command]').forEach(button => {
    button.addEventListener('click', () => { runCommand(button.dataset.command); input.focus(); });
  });
</script>
</body>
</html>
